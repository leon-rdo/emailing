# Instalar em /etc/nginx/sites-available/emailing e ligar por symlink em
# sites-enabled. Este é o arquivo ANTES do certbot: ele escuta só na 80 para o
# desafio http-01 passar. Depois de
#
#     certbot --nginx -d emailing.example.com
#
# o próprio certbot reescreve o bloco com o listen 443 ssl e o redirecionamento.
# Troque `emailing.example.com` pelo seu domínio (o mesmo do ALLOWED_HOSTS).
#
# SEMPRE `nginx -t` antes de recarregar: um erro de sintaxe aqui derruba todos
# os outros sites servidos pelo mesmo nginx.

server {
    listen 80;
    server_name emailing.example.com;

    # O teto de anexos do app é ~18 MiB brutos. Sem folga aqui o nginx corta
    # com 413 antes do Django validar, e o usuário vê erro do proxy em vez da
    # mensagem do formulário.
    client_max_body_size 25m;

    # O estático é servido pelo whitenoise. Não há `location /static/` de
    # propósito: um dono só para o estático evita divergência entre o que o
    # manifesto do whitenoise conhece e o que o nginx entrega.

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sem este cabeçalho o SECURE_SSL_REDIRECT do Django entra em loop e a
        # checagem de origem do CSRF falha em HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # X-Robots-Tag, CSP e Permissions-Policy são emitidos pelo Django. Uma
    # única origem por cabeçalho: repetir aqui só cria divergência.

    error_log /var/log/nginx/emailing_error.log;
    access_log /var/log/nginx/emailing_access.log;
}
